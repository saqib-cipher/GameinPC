name: Build and Release Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Download and Prepare Scrcpy Binaries
        run: |
          $scrcpyZipUrl = "https://github.com/Genymobile/scrcpy/releases/download/v3.1/scrcpy-win64-v3.1.zip"
          Invoke-WebRequest -Uri $scrcpyZipUrl -OutFile "scrcpy.zip"
          Expand-Archive -Path "scrcpy.zip" -DestinationPath "temp_scrcpy" -Force
          if (!(Test-Path "bin")) { New-Item -ItemType Directory -Path "bin" }
          Copy-Item -Path "temp_scrcpy\scrcpy-win64-*\*" -Destination "bin" -Recurse -Force
          Remove-Item "scrcpy.zip", "temp_scrcpy" -Recurse -Force

      - name: Install Node Dependencies
        run: npm ci

      - name: Build React UI & Distribute Executables
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist:all

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release/*.exe
            release/*.blockmap
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
